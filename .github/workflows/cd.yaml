name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag/name for a manual test release (creates a draft, not a real published release)"
        required: true
        default: "manual-test"

jobs:
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Blocks the release on failure (runs before Publish/Archive/Release below) -- unlike CI's
      # Test step, this one runs *with* Integration tests: it's the only place the actual built
      # artifacts (as opposed to CI's Debug-configuration unit suite) get exercised end-to-end
      # before something gets tagged as a release. tests/Desk/Integration/ServiceTests.cs finds its
      # Service.dll under out/Release/net10.0/ (this job's plain `dotnet build` above, not the
      # differently-shaped `dotnet publish` output below), and starts/pings/shuts it down itself --
      # no separate Service instance needs to be running first.
      - name: Integration test
        run: dotnet test --no-build -c Release --settings mstest.runsettings --filter TestCategory=Integration

      - name: Publish
        run: dotnet publish src/Service -c Release --no-restore

      - name: Archive
        run: |
          cd out/Release/net10.0/publish
          zip -r ../../../../desk-tools.zip .

      - id: tag
        run: echo "value=${{ github.event.inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: desk-tools.zip

  # Only relevant if installer/ was kept (see tasks/repo_setup.md) -- delete this job if you
  # deleted installer/ instead of tokenizing it, since it will otherwise fail looking for
  # installer/Setup.wixproj.
  release-windows-msi:
    needs: release-linux
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MSI
        run: dotnet build installer/Setup.wixproj -c Release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-linux.outputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: release/Release/Service.msi
