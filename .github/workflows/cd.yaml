name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag/name for a manual test release (creates a draft, not a real published release)"
        required: true
        default: "manual-test"

jobs:
  # win-x64 is src/Directory.Build.props' own default RuntimeIdentifier now (see its own remarks),
  # so this job -- running on ubuntu-latest -- needs an explicit override to linux-x64. Unlike
  # CI's own Linux job, this publishes a single project (src/Service), not the whole solution, so
  # -r works directly here rather than needing the DESK_TOOLS_RID environment-variable workaround
  # (the .NET SDK only rejects a command-line RID at the *solution* level). An explicit RID means
  # the publish output now lands in a RID-specific subfolder (out/Release/net10.0/linux-x64/publish/,
  # confirmed by actually running this locally) rather than the old out/Release/net10.0/publish/ --
  # the Archive step below was updated to match.
  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/Service -c Release -r linux-x64 --self-contained false

      - name: Archive
        run: |
          cd out/Release/net10.0/linux-x64/publish
          zip -r ../../../../../desk-tools.zip .

      - id: tag
        run: echo "value=${{ github.event.inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: desk-tools.zip

  # Only relevant if installer/ was kept (see tasks/repo_setup.md) -- delete this job if you
  # deleted installer/ instead of tokenizing it, since it will otherwise fail looking for
  # installer/Setup.wixproj.
  release-windows-msi:
    needs: release-linux
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MSI
        run: dotnet build installer/Setup.wixproj -c Release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-linux.outputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: release/Release/Service.msi
